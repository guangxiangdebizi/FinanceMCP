name: secret-guard

# A leaked credential must fail the build, not only the local pre-commit hook
# (hooks are per-clone and easy to skip with --no-verify).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-secrets.mjs --tracked
